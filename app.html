<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务Boss战</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Nunito', 'PingFang SC', sans-serif;
            background: #F6EAC9;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 180px;
            color: #5D4037;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,251,240,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(244,185,66,0.1) 0%, transparent 50%);
            overflow-y: auto;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .page-nav {
            max-width: 600px;
            margin: 0 auto 15px;
            padding: 8px 0;
            font-family: 'Nunito', 'PingFang SC', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: left;
            border-bottom: 2px dashed rgba(93, 64, 55, 0.2);
        }
        .page-nav .nav-current {
            color: #5D4037;
            margin-left: 20px;
        }
        .page-nav .nav-link {
            color: #A1887F;
            text-decoration: none;
            transition: color 0.2s;
        }
        .page-nav .nav-link:hover {
            color: #5D4037;
        }
        
        .timer-display {
            background: #FFFBF0;
            border: 3px solid #5D4037;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 6px 6px 0px rgba(93, 64, 55, 0.2);
            transition: all 0.3s;
            position: relative;
        }
        
        .timer-display.active {
            background: linear-gradient(135deg, #FFE5B4 0%, #F4B942 100%);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .current-task {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #5D4037;
            text-shadow: 2px 2px 0px rgba(246, 234, 201, 0.5);
        }
        
        .countdown {
            font-size: 56px;
            font-weight: 700;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            color: #E57373;
            text-shadow: 3px 3px 0px rgba(93, 64, 55, 0.1);
        }
        
        .task-progress {
            font-size: 16px;
            font-weight: 700;
            color: #5D4037;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        /* 音效设置区域 */
        .sound-controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .sound-controls:hover {
            opacity: 1;
        }

        .btn-sound-small {
            padding: 4px 8px;
            border: 2px solid #5D4037;
            border-radius: 8px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            color: #5D4037;
            font-weight: 700;
        }

        .btn-sound-small:hover {
            background: #AECB95;
        }
        
        button {
            padding: 12px 24px;
            border: 3px solid #5D4037;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 4px 4px 0px rgba(93, 64, 55, 0.3);
            color: #5D4037;
        }
        
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(93, 64, 55, 0.3);
        }
        
        .btn-stop {
            background: #E57373;
            color: white;
        }
        
        .btn-pause {
            background: #F4B942;
        }
        
        .tasks {
            background: #FFFBF0;
            border: 3px solid #5D4037;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 6px 6px 0px rgba(93, 64, 55, 0.2);
            min-height: 200px;
            margin-bottom: 20px;
        }
        
        .tier {
            margin-bottom: 25px;
            min-height: 50px; 
        }
        
        .tier-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .tier-title {
            font-size: 16px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-block;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            cursor: pointer;
            user-select: none;
        }

        .add-task-btn {
            background: #FFFBF0;
            border: 2px solid #5D4037;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            color: #5D4037;
            box-shadow: 2px 2px 0px rgba(93, 64, 55, 0.2);
            transition: transform 0.1s;
        }

        .add-task-btn:active {
            transform: scale(0.9);
        }
        
        .tier-red .tier-title { 
            background: #E57373; 
            color: white;
            border: 3px solid #5D4037;
        }
        .tier-orange .tier-title { 
            background: #F4B942; 
            border: 3px solid #5D4037;
        }
        .tier-blue .tier-title { 
            background: #AECB95; 
            border: 3px solid #5D4037;
        }
        .tier-gray .tier-title { 
            background: #D7CCC8; 
            border: 3px solid #5D4037;
        }
        
        .task-item {
            background: #FFFBF0;
            border: 3px solid #5D4037;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s, opacity 0.2s;
            box-shadow: 4px 4px 0px rgba(93, 64, 55, 0.2);
            position: relative;
        }

        .task-item:active {
            cursor: grabbing;
        }

        .task-item.dragging {
            opacity: 0.5;
            background: #FFF8E1;
            transform: scale(0.98);
            border: 3px dashed #5D4037;
        }
        
        .task-item:hover {
            background: #FFF8E1;
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px rgba(93, 64, 55, 0.2);
        }
        
        .task-item.completed {
            opacity: 0.5;
            cursor: default;
            filter: grayscale(0.5);
        }
        
        .task-name {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .edit-btn {
            background: #AECB95;
            border: 2px solid #5D4037;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(93, 64, 55, 0.2);
        }
        
        .edit-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px rgba(93, 64, 55, 0.2);
        }
        
        .hp-bar-container {
            background: #E0D6BC;
            height: 16px;
            border-radius: 8px;
            border: 2px solid #5D4037;
            overflow: hidden;
            margin-bottom: 6px;
            position: relative;
        }
        
        .hp-bar-fill {
            height: 100%;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, #E57373 0%, #AECB95 100%);
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent),
                linear-gradient(90deg, #E57373 0%, #AECB95 100%);
            background-size: 1rem 1rem, 100% 100%;
            position: relative;
        }
        
        .hp-bar-fill.low {
            background: linear-gradient(90deg, #E57373 0%, #E57373 100%);
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent),
                linear-gradient(90deg, #E57373 0%, #E57373 100%);
            background-size: 1rem 1rem, 100% 100%;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .task-hours {
            font-size: 12px;
            color: #8D6E63;
            font-weight: 700;
        }
        
        .rest-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(93, 64, 55, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .rest-modal.show {
            display: flex;
        }
        
        .rest-content {
            background: #FFFBF0;
            padding: 40px;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            border: 4px solid #5D4037;
            text-align: center;
            max-width: 400px;
            box-shadow: 8px 8px 0px rgba(93, 64, 55, 0.3);
            animation: bounceIn 0.5s;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        
        .rest-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #E57373;
            text-shadow: 2px 2px 0px rgba(246, 234, 201, 0.5);
        }
        
        .rest-content p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #5D4037;
            line-height: 1.6;
        }
        
        .btn-continue {
            background: #AECB95;
            color: #5D4037;
            padding: 15px 40px;
            font-size: 18px;
            border: 3px solid #5D4037;
            box-shadow: 4px 4px 0px rgba(93, 64, 55, 0.3);
        }
        
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(93, 64, 55, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        
        .edit-modal.show {
            display: flex;
        }
        
        .edit-content {
            background: #FFFBF0;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #5D4037;
            box-shadow: 6px 6px 0px rgba(93, 64, 55, 0.3);
            width: 320px;
        }
        
        .edit-content h3 {
            margin-bottom: 20px;
            color: #5D4037;
        }

        .edit-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .edit-content input {
            width: 100%;
            padding: 12px;
            border: 3px solid #5D4037;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            margin-bottom: 15px;
            background: white;
        }
        
        .edit-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-save {
            background: #AECB95;
            flex: 1;
        }
        
        .btn-cancel {
            background: #D7CCC8;
            flex: 1;
        }
        
        .btn-delete {
            background: #E57373;
            color: white;
            flex: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tier-collapse-icon {
            display: inline-block;
            transition: transform 0.3s;
            margin-right: 5px;
        }
        
        .tier-header.collapsed .tier-collapse-icon {
            transform: rotate(-90deg);
        }
        
        .tier-items {
            min-height: 10px; /* target area for empty lists */
            transition: max-height 0.3s ease;
        }
        
        .tier-items.collapsed {
            display: none;
        }
    
        /* ========== 太宰治消息列表 ========== */
        .lover-message-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 150px;
            background: linear-gradient(to top, rgba(93, 64, 55, 0.95) 0%, rgba(93, 64, 55, 0.7) 70%, transparent 100%);
            padding: 10px 20px 15px 20px;
            z-index: 100;
        }
        
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .lover-message {
            align-self: flex-end;
            max-width: 80%;
            padding: 8px 14px;
            background: linear-gradient(135deg, #FFE5B4 0%, #F4B942 100%);
            border: 2px solid #5D4037;
            border-radius: 15px 15px 5px 15px;
            font-size: 14px;
            color: #5D4037;
            font-weight: 600;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            animation: messageIn 0.3s ease;
        }
        
        @keyframes messageIn {
            from { 
                opacity: 0; 
                transform: translateY(10px) scale(0.95);
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
        }
        
        .message-list::-webkit-scrollbar {
            width: 4px;
        }
        
        .message-list::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
    
    </style>
</head>
<body>
    <nav class="page-nav">
        <a href="index.html" class="nav-link">← 虚拟端</a>
        <span class="nav-current">● 现实端</span>
    </nav>
    <div class="container">
        <div class="timer-display" id="timerDisplay">
            <div class="current-task" id="currentTaskName">🎯 选择一个Boss开始战斗</div>
            <div class="countdown" id="countdown">00:00:00</div>
            <div class="task-progress" id="taskProgress">-</div>
            
            <div class="controls" id="controls" style="display:none;">
                <button class="btn-pause" id="pauseBtn">⏸ 暂停</button>
                <button class="btn-stop" id="stopBtn">⏹ 停止</button>
            </div>

            <!-- 音效设置面板，鹤见君的需求 -->
            <div class="sound-controls">
                <button class="btn-sound-small" onclick="testAlarm()" title="测试当前闹铃声音">🔔 测试音效</button>
                <button class="btn-sound-small" onclick="document.getElementById('soundUpload').click()" title="上传自定义MP3/WAV">📂 设定本地声音</button>
                <button class="btn-sound-small" onclick="resetSound()" title="恢复默认哔哔声">↩️ 默认</button>
                <input type="file" id="soundUpload" accept="audio/*" style="display:none" onchange="handleSoundUpload(this)">
            </div>
        </div>
        
        <div class="tasks" id="tasksList"></div>
    </div>
    
    
    <!-- 太宰治消息列表 -->
    <div class="lover-message-container">
        <div class="message-list" id="messageList">
            <!-- 消息动态生成 -->
        </div>
    </div>
    
    <div class="rest-modal" id="restModal">
        <div class="rest-content">
            <h2>🐱 喵~</h2>
            <p>鹤见君，你已经专注了很久啦！<br>休息一下，喝口水吧~ ☕</p>
            <button class="btn-continue" onclick="closeRestModal()">知道了！</button>
        </div>
    </div>
    
    <div class="edit-modal" id="editModal">
        <div class="edit-content">
            <h3>✏️ 修改Boss属性</h3>
            
            <label class="edit-label">任务名称</label>
            <input type="text" id="editNameInput" placeholder="输入任务名称">
            
            <label class="edit-label">总时长 (小时)</label>
            <input type="number" id="editTimeInput" min="0" step="0.5" placeholder="输入新的总时长">
            
            <div class="edit-buttons">
                <button class="btn-save" onclick="saveEdit()">保存</button>
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-delete" onclick="deleteTask()" title="删除">🗑️</button>
            </div>
        </div>
    </div>

    <script>
        // 默认数据
        const defaultTasks = [
            {tier: 'red', tierName: '🔴 第一梯队：紧急重要', items: [
                {name: '备团：演绎本我润色', total: 8},
                {name: '立绘：NPC/角色工业化产出', total: 40}
            ]},
            {tier: 'orange', tierName: '🟠 第二梯队：紧急/固定时间', items: [
                {name: '外出：市中心医院副本', total: 10},
                {name: '洗衣服', total: 2}
            ]},
            {tier: 'blue', tierName: '🔵 第三梯队：重要不紧急', items: [
                {name: '整理电脑', total: 8},
                {name: '视频文案提取与归档', total: 10},
                {name: '收房间', total: 4}
            ]},
            {tier: 'gray', tierName: '⚪ 第四梯队：项目库', collapsed: true, items: [
                {name: '小丑牌Demo', total: 200},
                {name: '生活手游数值化正反馈设计师', total: 100},
                {name: '雾箱解谜AVG游戏', total: 80},
                {name: '渡园之+林中小屋replay', total: 60},
                {name: '星露谷AI电子室友Demo', total: 50},
                {name: '跑团问卷名片', total: 50},
                {name: '雾都孤儿 DOL 叙事插件', total: 40},
                {name: '明镜replay', total: 30},
                {name: '文豪野犬AVG开发', total: 20},
                {name: '共同设计时间协同Demo', total: 20},
                {name: '扣子Replay制作软件', total: 10},
                {name: '营销工具设计', total: 10},
                {name: '信息差商业发现工具', total: 10},
                {name: '亮光同人图', total: 10},
                {name: '审美导师', total: 10},
                {name: 'MCP，AI工具整理', total: 8},
                {name: 'Ob笔记 整理prompt', total: 4},
                {name: '谷歌AI账号整理', total: 2}
            ]}
        ];

        let tasks = [];
        let timer = null;
        let isPaused = false;
        let currentTask = null;
        let editingTask = null;
        let editingTaskCoords = null;
        
        // ========== 时间戳计时系统（修复后台计时问题）==========
        const TIMER_STATE_KEY = 'taskBoss_timer_state';
        let timerStartTimestamp = null;    // 计时开始的时间戳
        let totalPausedMs = 0;             // 累计暂停的毫秒数
        let pausedAtTimestamp = null;      // 暂停时的时间戳
        let sessionLimitSeconds = 0;       // 本局上限（秒）
        
        // ========== 太宰治文本池 ==========
        const DAZAI_TEXT_POOL = {
            TASK_CHAT: {
                START: ["那就开始吧。", "又要工作了？", "啊啊，真麻烦。", "去吧去吧。", "加油咯。"],
                PAUSE: ["累了？", "要休息吗？", "逃跑了啊。", "偷懒可不好哦。", "稍微歇歇吧。"],
                COMPLETE: ["做得很好。", "辛苦了。", "比我想象的能干。", "这就结束了？", "不错嘛。"],
                RESUME: ["继续了？", "休息够了吗？", "嗯，去吧。", "别勉强自己。", "我在看着呢。"]
            }
        };
        
        // ========== 消息系统 ==========
        const MESSAGES_KEY = 'lover_messages';
        
        function getLoverMessage(eventType) {
            let pool;
            switch(eventType) {
                case 'START_TASK': pool = DAZAI_TEXT_POOL.TASK_CHAT.START; break;
                case 'PAUSE_TASK': pool = DAZAI_TEXT_POOL.TASK_CHAT.PAUSE; break;
                case 'COMPLETE_TASK': pool = DAZAI_TEXT_POOL.TASK_CHAT.COMPLETE; break;
                case 'RESUME_TASK': pool = DAZAI_TEXT_POOL.TASK_CHAT.RESUME; break;
                default: pool = DAZAI_TEXT_POOL.TASK_CHAT.START;
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }
        
        function addMessageToList(text) {
            let messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '{"messages":[]}');
            messages.messages.push({
                id: "msg_" + Date.now(),
                text: text,
                timestamp: Date.now()
            });
            if (messages.messages.length > 50) {
                messages.messages = messages.messages.slice(-50);
            }
            localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));
            renderMessageList();
        }
        
        function renderMessageList() {
            const container = document.getElementById('messageList');
            if (!container) return;
            
            const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '{"messages":[]}');
            container.innerHTML = '';
            
            const recentMessages = messages.messages.slice(-10);
            recentMessages.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = 'lover-message';
                div.textContent = msg.text;
                div.style.opacity = Math.min(1, 0.3 + (index / recentMessages.length) * 0.7);
                container.appendChild(div);
            });
            
            container.scrollTop = container.scrollHeight;
        }
        
        // ========== 信号发送系统 ==========
        function sendSignal(type) {
            const packet = {
                type: type,
                timestamp: Date.now()
            };
            localStorage.setItem('reality_anchor_signal', JSON.stringify(packet));
            console.log("📡 [信号发送] " + type);
        } 
        
        // 默认的“复古”提示音

        // --- 渲染逻辑 (保持原样) ---

        function renderTasks() {
            const container = document.getElementById('tasksList');
            container.innerHTML = '';
            
            tasks.forEach((tier, tierIndex) => {
                const tierDiv = document.createElement('div');
                tierDiv.className = `tier tier-${tier.tier}`;
                
                const header = document.createElement('div');
                header.className = 'tier-header';
                if (tier.collapsed) header.classList.add('collapsed');
                
                const title = document.createElement('div');
                title.className = 'tier-title';
                title.innerHTML = `<span class="tier-collapse-icon">▼</span> ${tier.tierName}`;
                title.onclick = () => toggleTier(tier, tierIndex);
                
                const addBtn = document.createElement('div');
                addBtn.className = 'add-task-btn';
                addBtn.textContent = '+';
                addBtn.title = '添加新任务';
                addBtn.onclick = (e) => {
                    e.stopPropagation();
                    addNewTask(tierIndex);
                };

                header.appendChild(title);
                header.appendChild(addBtn);
                tierDiv.appendChild(header);
                
                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'tier-items';
                itemsContainer.dataset.tierIndex = tierIndex; 
                if (tier.collapsed) itemsContainer.classList.add('collapsed');
                
                itemsContainer.addEventListener('dragover', handleDragOver);
                itemsContainer.addEventListener('drop', (e) => handleDrop(e, tierIndex));
                itemsContainer.addEventListener('dragleave', handleDragLeave);

                tier.items.forEach((task, taskIndex) => {
                    const taskDiv = document.createElement('div');
                    taskDiv.className = 'task-item';
                    taskDiv.draggable = true;
                    if (task.remaining <= 0) {
                        taskDiv.classList.add('completed');
                    }
                    
                    taskDiv.addEventListener('dragstart', (e) => handleDragStart(e, tierIndex, taskIndex));
                    taskDiv.addEventListener('dragend', handleDragEnd);
                    
                    const hpPercent = (task.remaining / task.total) * 100;
                    
                    taskDiv.innerHTML = `
                        <div class="task-name">
                            <span>${task.name}</span>
                            <button class="edit-btn" onclick="event.stopPropagation(); openEditModal(${tierIndex}, ${taskIndex})">✏️</button>
                        </div>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill ${hpPercent < 30 ? 'low' : ''}" style="width: ${hpPercent}%"></div>
                        </div>
                        <div class="task-hours">❤️ 剩余HP: ${task.remaining.toFixed(1)}h / ${task.total}h</div>
                    `;
                    
                    if (task.remaining > 0) {
                        taskDiv.onclick = (e) => {
                            startTask(task);
                        };
                    }
                    
                    itemsContainer.appendChild(taskDiv);
                });
                
                tierDiv.appendChild(itemsContainer);
                container.appendChild(tierDiv);
            });
        }

        function toggleTier(tier, index) {
            tier.collapsed = !tier.collapsed;
            saveProgress();
            renderTasks();
        }

        // --- DnD Logic ---

        let draggedItem = null;

        function handleDragStart(e, tierIndex, taskIndex) {
            draggedItem = { tierIndex, taskIndex };
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem));
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            draggedItem = null;
        }

        function handleDragOver(e) {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragLeave(e) {
        }

        function handleDrop(e, targetTierIndex) {
            e.stopPropagation(); 
            
            if (!draggedItem) return false;

            const target = e.target.closest('.task-item');
            const container = e.target.closest('.tier-items');
            
            let targetTaskIndex;
            
            if (target) {
                const rect = target.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                const siblings = Array.from(container.children);
                const hoverIndex = siblings.indexOf(target);
                
                if (e.clientY < midY) {
                    targetTaskIndex = hoverIndex;
                } else {
                    targetTaskIndex = hoverIndex + 1;
                }
            } else {
                targetTaskIndex = tasks[targetTierIndex].items.length;
            }

            moveTask(draggedItem.tierIndex, draggedItem.taskIndex, targetTierIndex, targetTaskIndex);
            
            return false;
        }

        function moveTask(fromTier, fromIdx, toTier, toIdx) {
            const taskToMove = tasks[fromTier].items[fromIdx];
            tasks[fromTier].items.splice(fromIdx, 1);
            
            if (fromTier === toTier && toIdx > fromIdx) {
                toIdx--;
            }
            
            tasks[toTier].items.splice(toIdx, 0, taskToMove);
            
            saveProgress();
            renderTasks();
        }

        // --- Editing Logic ---

        function openEditModal(tierIndex, taskIndex) {
            editingTaskCoords = { tierIndex, taskIndex };
            editingTask = tasks[tierIndex].items[taskIndex];
            
            document.getElementById('editNameInput').value = editingTask.name;
            document.getElementById('editTimeInput').value = editingTask.total;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingTask = null;
            editingTaskCoords = null;
        }

        function saveEdit() {
            const newName = document.getElementById('editNameInput').value.trim();
            const newTotal = parseFloat(document.getElementById('editTimeInput').value);
            
            if (newName && newTotal && newTotal > 0 && editingTask) {
                const oldTotal = editingTask.total;
                const workedHours = oldTotal - editingTask.remaining;
                
                editingTask.name = newName;
                editingTask.total = newTotal;
                editingTask.remaining = Math.max(0, newTotal - workedHours);
                
                saveProgress();
                renderTasks();
            }
            closeEditModal();
        }
        
        function deleteTask() {
            if (editingTaskCoords && confirm('鹤见君，确定要删除这个任务吗？一旦删除就无法恢复了哦。')) {
                tasks[editingTaskCoords.tierIndex].items.splice(editingTaskCoords.taskIndex, 1);
                saveProgress();
                renderTasks();
                closeEditModal();
            }
        }
        
        // --- Add New Task ---
        
        function addNewTask(tierIndex) {
            const name = prompt("请输入新任务的名称：");
            if (name) {
                const totalStr = prompt("请输入总时长（小时）：", "2");
                const total = parseFloat(totalStr);
                
                if (!isNaN(total) && total > 0) {
                    const newTask = {
                        id: 'task_' + Math.now + Math.random(),
                        name: name,
                        total: total,
                        remaining: total
                    };
                    
                    tasks[tierIndex].items.push(newTask);
                    
                    if(tasks[tierIndex].collapsed) {
                        tasks[tierIndex].collapsed = false;
                    }
                    
                    saveProgress();
                    renderTasks();
                } else {
                    alert("时长格式不对哦，请输入数字。");
                }
            }
        }

        // --- Timer Logic (时间戳版本，修复后台计时) ---

        // 计算已过秒数（基于时间戳，不受后台节流影响）
        function getElapsedSeconds() {
            if (!timerStartTimestamp) return 0;
            
            let elapsed = Date.now() - timerStartTimestamp - totalPausedMs;
            if (isPaused && pausedAtTimestamp) {
                elapsed -= (Date.now() - pausedAtTimestamp);
            }
            return Math.floor(elapsed / 1000);
        }
        
        // 计算剩余秒数
        function getRemainingSeconds() {
            return Math.max(0, sessionLimitSeconds - getElapsedSeconds());
        }
        
        // 保存计时状态到localStorage
        function saveTimerState() {
            if (!currentTask) return;
            const state = {
                isRunning: timer !== null,
                isPaused: isPaused,
                taskId: currentTask.id,
                timerStartTimestamp: timerStartTimestamp,
                pausedAtTimestamp: pausedAtTimestamp,
                totalPausedMs: totalPausedMs,
                sessionLimitSeconds: sessionLimitSeconds
            };
            localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(state));
        }
        
        // 清除计时状态
        function clearTimerState() {
            localStorage.removeItem(TIMER_STATE_KEY);
        }
        
        // 根据ID查找任务
        function findTaskById(taskId) {
            for (const tier of tasks) {
                for (const task of tier.items) {
                    if (task.id === taskId) return task;
                }
            }
            return null;
        }
        
        // 恢复计时状态（页面加载时调用）
        function restoreTimerState() {
            const saved = localStorage.getItem(TIMER_STATE_KEY);
            if (!saved) return false;
            
            try {
                const state = JSON.parse(saved);
                if (!state.isRunning || !state.taskId) {
                    clearTimerState();
                    return false;
                }
                
                currentTask = findTaskById(state.taskId);
                if (!currentTask || currentTask.remaining <= 0) {
                    clearTimerState();
                    return false;
                }
                
                timerStartTimestamp = state.timerStartTimestamp;
                totalPausedMs = state.totalPausedMs || 0;
                pausedAtTimestamp = state.pausedAtTimestamp;
                sessionLimitSeconds = state.sessionLimitSeconds;
                isPaused = state.isPaused;
                
                // 检查是否已超时
                if (getRemainingSeconds() <= 0) {
                    completeSession();
                    return true;
                }
                
                // 恢复UI
                document.getElementById('timerDisplay').classList.add('active');
                document.getElementById('currentTaskName').textContent = '⚔️ ' + currentTask.name;
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('pauseBtn').textContent = isPaused ? '▶️ 继续' : '⏸ 暂停';
                
                // 重新启动定时器
                let saveCounter = 0;
                timer = setInterval(() => {
                    if (!isPaused) {
                        updateDisplay();
                        if (getRemainingSeconds() <= 0) {
                            completeSession();
                        }
                        // 每10秒自动保存一次状态
                        saveCounter++;
                        if (saveCounter >= 10) {
                            saveTimerState();
                            saveCounter = 0;
                        }
                    }
                }, 1000);
                
                updateDisplay();
                addMessageToList("……你回来了。");
                console.log('✅ 计时状态已恢复');
                return true;
            } catch(e) {
                console.error('恢复计时状态失败:', e);
                clearTimerState();
                return false;
            }
        }

        function startTask(task) {
            if (timer) {
                alert('请先停止当前任务');
                return;
            }
            
            currentTask = task;
            const sessionTime = Math.min(task.remaining, 2);
            sessionLimitSeconds = sessionTime * 3600;
            timerStartTimestamp = Date.now();
            totalPausedMs = 0;
            pausedAtTimestamp = null;
            isPaused = false;
            
            document.getElementById('timerDisplay').classList.add('active');
            document.getElementById('currentTaskName').textContent = '⚔️ ' + task.name;
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('pauseBtn').textContent = '⏸ 暂停';
            
            // 保存状态
            saveTimerState();
            
            // 发送信号 & 显示消息
            sendSignal('ENTER_DUNGEON');
            addMessageToList(getLoverMessage('START_TASK'));
            
            let saveCounter = 0;
            timer = setInterval(() => {
                if (!isPaused) {
                    updateDisplay();
                    if (getRemainingSeconds() <= 0) {
                        completeSession();
                    }
                    // 每10秒自动保存一次状态（防止意外关闭丢失）
                    saveCounter++;
                    if (saveCounter >= 10) {
                        saveTimerState();
                        saveCounter = 0;
                    }
                }
            }, 1000);
            
            updateDisplay();
        }

        function updateDisplay() {
            const remaining = getRemainingSeconds();
            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = Math.floor(remaining % 60);
            
            document.getElementById('countdown').textContent = 
                String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
            
            if (currentTask) {
                document.getElementById('taskProgress').textContent = 
                    '❤️ Boss剩余HP: ' + currentTask.remaining.toFixed(1) + 'h';
            }
        }

        function completeSession() {
            clearInterval(timer);
            timer = null;
            
            audio.loop = true;
            audio.play().catch(e => console.log('Audio play failed:', e));
            
            // 限制最大扣血量为本局上限（最多2小时）
            const elapsedSeconds = Math.min(getElapsedSeconds(), sessionLimitSeconds);
            const hoursWorked = elapsedSeconds / 3600;
            if (currentTask) {
                currentTask.remaining = Math.max(0, currentTask.remaining - hoursWorked);
                saveProgress();
            }
            
            // 发送信号 & 显示消息
            sendSignal('LEAVE_DUNGEON');
            addMessageToList(getLoverMessage('COMPLETE_TASK'));
            
            document.getElementById('restModal').classList.add('show');
            
            clearTimerState();
            resetTimer();
            renderTasks();
        }

        function closeRestModal() {
            document.getElementById('restModal').classList.remove('show');
            audio.pause();
            audio.currentTime = 0;
            audio.loop = false;
        }

        function resetTimer() {
            clearInterval(timer);
            timer = null;
            isPaused = false;
            currentTask = null;
            timerStartTimestamp = null;
            totalPausedMs = 0;
            pausedAtTimestamp = null;
            sessionLimitSeconds = 0;
            
            document.getElementById('timerDisplay').classList.remove('active');
            document.getElementById('currentTaskName').textContent = '🎯 选择一个Boss开始战斗';
            document.getElementById('countdown').textContent = '00:00:00';
            document.getElementById('taskProgress').textContent = '-';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('pauseBtn').textContent = '⏸ 暂停';
        }

        document.getElementById('pauseBtn').onclick = () => {
            isPaused = !isPaused;
            
            if (isPaused) {
                pausedAtTimestamp = Date.now();
                sendSignal('LEAVE_DUNGEON');
                addMessageToList(getLoverMessage('PAUSE_TASK'));
            } else {
                if (pausedAtTimestamp) {
                    totalPausedMs += (Date.now() - pausedAtTimestamp);
                }
                pausedAtTimestamp = null;
                sendSignal('ENTER_DUNGEON');
                addMessageToList(getLoverMessage('RESUME_TASK'));
            }
            
            document.getElementById('pauseBtn').textContent = isPaused ? '▶️ 继续' : '⏸ 暂停';
            saveTimerState();
        };

        document.getElementById('stopBtn').onclick = () => {
            if (confirm('确定要停止吗？当前进度将会保存')) {
                // 限制最大扣血量为本局上限（最多2小时）
                const elapsedSeconds = Math.min(getElapsedSeconds(), sessionLimitSeconds);
                const hoursWorked = elapsedSeconds / 3600;
                if(currentTask) {
                    currentTask.remaining = Math.max(0, currentTask.remaining - hoursWorked);
                    saveProgress();
                }
                
                sendSignal('LEAVE_DUNGEON');
                
                clearTimerState();
                resetTimer();
                renderTasks();
            }
        };
        
        // 页面可见性变化时立即更新显示
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && timer && !isPaused) {
                updateDisplay();
                // 检查是否已超时
                if (getRemainingSeconds() <= 0) {
                    completeSession();
                }
            }
        });
        
        // 页面关闭前保存状态
        window.addEventListener('beforeunload', () => {
            if (timer) {
                saveTimerState();
            }
        });

        // Boot
        initData();
        renderTasks();
        renderMessageList();
        
        // 尝试恢复计时状态
        restoreTimerState();
        
        // ========== 监听来自Progress Knight的信号 ==========
        let lastIncomingSignalTime = null;
        
        function pollIncomingSignals() {
            const signalData = localStorage.getItem('reality_anchor_signal');
            if (!signalData) return;
            
            try {
                const packet = JSON.parse(signalData);
                
                // 避免重复处理
                if (lastIncomingSignalTime === packet.timestamp) return;
                lastIncomingSignalTime = packet.timestamp;
                
                // 只处理来自Progress Knight的信号
                if (packet.type === 'DUNGEON_ABANDONED') {
                    console.log('🎯 [app.html收到信号] 副本中途退出，自动暂停任务');
                    
                    // 如果正在运行任务，自动暂停
                    if (timer && !isPaused) {
                        document.getElementById('pauseBtn').click();
                        
                        // 显示提示
                        addMessageToList('检测到副本中途退出，任务已自动暂停。');
                    }
                    
                    // 删除信号（已处理完毕）
                    localStorage.removeItem('reality_anchor_signal');
                }
                
            } catch(e) {
                console.error('[信号解析错误]', e);
            }
        }
        
        // 每秒检查一次来自Progress Knight的信号
        setInterval(pollIncomingSignals, 1000);

    </script>
</body>
</html>
