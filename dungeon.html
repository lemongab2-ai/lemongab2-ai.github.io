<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无貌之神的演员 - 剧本</title>
    <style>
/* =========================================
A Dark Room 风格 - 白底黑字版本
========================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Courier New", Courier, monospace;
    background-color: #f7f7f7;
    color: #2c2c2c;
    min-height: 100vh;
    padding: 20px;
    line-height: 1.6;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
}

/* 副本标题栏 */
.dungeon-header {
    background: transparent;
    border: 1px solid #333;
    border-radius: 0;
    padding: 20px;
    margin-bottom: 20px;
}

.dungeon-title {
    font-size: 1.8em;
    color: #2c2c2c;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.dungeon-meta {
    font-size: 0.9em;
    color: #666;
    margin-bottom: 15px;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 10px;
}

/* SAN值显示 */
.san-display {
    margin-top: 15px;
}

.san-display > div:first-child {
    font-size: 0.9em;
    margin-bottom: 8px;
    color: #2c2c2c;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.san-bar {
    width: 100%;
    height: 20px;
    background: #e8e8e8;
    border: 1px solid #333;
    border-radius: 0;
    overflow: hidden;
    position: relative;
}

.san-fill {
    height: 100%;
    background-color: #333 !important;
    background-image: none !important;
    transition: width 0.5s ease;
    border-radius: 0;
}

.san-text {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    text-align: center;
    line-height: 20px;
    font-size: 11px;
    font-weight: bold;
    color: #2c2c2c;
    text-shadow: none;
}

/* 通关条件显示 */
.conditions-display {
    margin-top: 15px;
    padding: 10px;
    background: transparent;
    border: 1px solid #ddd;
    border-radius: 0;
}

.conditions-title {
    font-size: 0.9em;
    color: #2c2c2c;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.conditions-list {
    font-size: 0.85em;
    color: #555;
}

.condition-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    padding: 5px 0;
    border-bottom: 1px dotted #ddd;
}

.condition-item.met {
    color: #333;
    font-weight: bold;
}

.condition-item.not-met {
    color: #999;
}

/* 故事文本区域 */
.story-container {
    background: #fff;
    border: 1px solid #333;
    border-radius: 0;
    padding: 30px;
    min-height: 200px;
    margin-bottom: 20px;
}

.story-line {
    font-size: 1em;
    line-height: 1.8;
    margin-bottom: 15px;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards;
    color: #2c2c2c;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

.story-line.story-npc_lover {
    color: #666;
    font-style: italic;
    padding-left: 20px;
    border-left: 2px solid #999;
}

.story-line.story-ending {
    font-weight: bold;
    text-align: center;
}

.story-line.story-epilogue {
    color: #666;
    font-style: italic;
}

/* 进度提示 */
.progress-hint {
    text-align: center;
    color: #999;
    font-size: 0.9em;
    margin: 20px 0;
}

/* 按钮组 */
.action-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    padding: 10px 25px;
    border: 1px solid #333;
    border-radius: 0;
    font-size: 0.9em;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: #fff;
    color: #2c2c2c;
}

.btn-primary {
    background: #fff;
    color: #2c2c2c;
    border: 1px solid #333;
}

.btn-primary:hover {
    background: #333;
    color: #fff;
}

.btn-danger {
    background: #fff;
    color: #2c2c2c;
    border: 1px solid #333;
}

.btn-danger:hover {
    background: #333;
    color: #fff;
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #f0f0f0;
    color: #999;
}

/* 结局面板 */
.ending-panel {
    display: none;
    background: #fff;
    border: 2px solid #333;
    border-radius: 0;
    padding: 30px;
    text-align: center;
}

.ending-panel.active {
    display: block;
}

.ending-title {
    font-size: 1.8em;
    color: #2c2c2c;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.memento-display {
    background: #f7f7f7;
    border: 1px solid #333;
    border-radius: 0;
    padding: 20px;
    margin: 20px 0;
}

.memento-name {
    font-size: 1.3em;
    color: #2c2c2c;
    margin-bottom: 10px;
    font-weight: bold;
}

.memento-effect {
    color: #555;
    font-size: 0.9em;
}

/* 技能区域 */
.skills-summary {
    background: transparent;
    border: 1px solid #333;
    border-radius: 0;
    padding: 20px;
    margin-bottom: 20px;
}

.skills-title {
    font-size: 1em;
    color: #2c2c2c;
    margin-bottom: 15px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 10px;
}

.skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
}

.skill-item {
    background: #fff;
    border: 1px solid #333;
    border-radius: 0;
    padding: 10px;
    text-align: center;
}

.skill-name {
    font-size: 0.85em;
    color: #2c2c2c;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.skill-progress-bar {
    width: 100%;
    height: 4px;
    background: #e8e8e8;
    border: 1px solid #333;
    border-radius: 0;
    overflow: hidden;
    margin: 6px 0;
}

.skill-progress-fill {
    height: 100%;
    background-color: #333 !important;
    background-image: none !important;
    transition: width 0.3s ease;
}

.skill-exp {
    font-size: 0.7em;
    color: #999;
    margin-top: 4px;
}

.skill-level {
    font-size: 0.9em;
    color: #2c2c2c;
    font-weight: normal;
}

.hidden {
    display: none !important;
}

/* 速度控制按钮 */
.speed-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    gap: 5px;
    background: #f7f7f7;
    padding: 10px;
    border: 1px solid #333;
    border-radius: 0;
}

.speed-btn {
    background: #fff;
    color: #2c2c2c;
    border: 1px solid #333;
    padding: 8px 15px;
    border-radius: 0;
    cursor: pointer;
    font-size: 0.9em;
    transition: all 0.2s ease;
    min-width: 60px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.speed-btn.active {
    background: #333 !important;
    border-color: #333 !important;
    color: #fff !important;
    font-weight: bold;
}

.speed-btn:hover {
    background: #e8e8e8;
    border-color: #333;
}

.speed-btn.active:hover {
    background: #333 !important;
}

@media (max-width: 768px) {
    .dungeon-title {
        font-size: 1.3em;
    }

    .skills-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    }

    .container {
        padding: 10px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="speed-controls">
            <button class="speed-btn active" id="speed-1x" onclick="setGameSpeed(1)">×1</button>
            <button class="speed-btn" id="speed-5x" onclick="setGameSpeed(5)">×5</button>
            <button class="speed-btn" id="speed-10x" onclick="setGameSpeed(10)">×10</button>
        </div>

        <div class="dungeon-header">
            <div class="dungeon-title" id="dungeonTitle">加载中...</div>
            <div class="dungeon-meta">
                <span id="dungeonSource">---</span> |
                难度: <span id="dungeonDifficulty">---</span>
            </div>

            <div class="san-display">
                <div>精神状态 (SAN)</div>
                <div class="san-bar">
                    <div class="san-fill" id="sanFill" style="width: 80%;"></div>
                    <div class="san-text" id="sanText">80 / 100</div>
                </div>
            </div>

            <div class="conditions-display">
                <div class="conditions-title">📋 通关条件</div>
                <div class="conditions-list" id="conditionsList"></div>

        </div>

        <div class="skills-summary hidden" id="skillsSummary">

        </div>

        <div class="story-container" id="storyContainer">
            <div style="text-align: center; color: #7f8c8d;">

            </div>
        </div>

        <div class="progress-hint" id="progressHint">

        <div class="action-buttons" id="actionButtons">

        </div>

            <div class="ending-title">【剧目落幕】</div>
            <div class="memento-display">

                <div class="memento-effect" id="mementoEffect">---</div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="returnToBackend()">返回后台</button>
            </div>
        </div>
    </div>

    <script src="js/shared.js"></script>
	
	<script>
    class StoryParser {
        constructor(mdContent) {
            this.md = mdContent;
            this.parsed = this.parse();
        }

        parse() {
            const sections = {
                opening: [],
                branch3: [],
                loop2: {
                    route1: [],
                    route2: []
                },
                npcLover: [],
                ending: [],
                epilogue: []
            };

            // 【OPENING】开局（固定）
            const openingMatch = this.md.match(/【OPENING】\n([\s\S]*?)(?=#### 【BRANCH_3】|### 【BRANCH_3】|【BRANCH_3】|$)/i);
            if (openingMatch) {
                const text = openingMatch[1].trim();
                sections.opening = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
            }

            // 【BRANCH_3】随机发展三选一（分支A/B/C）
            const branch3Match = this.md.match(/【BRANCH_3】[^]*?随机三选一\n([\s\S]*?)(?=#### 【LOOP_2】|### 【LOOP_2】|【LOOP_2】|$)/i);
            if (branch3Match) {
                const branches = [];
                const aMatch = branch3Match[1].match(/\*\*分支A[：:]\*\*([\s\S]*?)(?=\*\*分支B|$)/);
                const bMatch = branch3Match[1].match(/\*\*分支B[：:]\*\*([\s\S]*?)(?=\*\*分支C|$)/);
                const cMatch = branch3Match[1].match(/\*\*分支C[：:]\*\*([\s\S]*?)(?=#### 【|### 【|【|$)/);
                if (aMatch) branches.push(aMatch[1].trim());
                if (bMatch) branches.push(bMatch[1].trim());
                if (cMatch) branches.push(cMatch[1].trim());
                sections.branch3 = branches;
            }

            // 【LOOP_2】可循环二选一
            const loop2Match = this.md.match(/【LOOP_2】[^]*?可循环路线\n([\s\S]*?)(?=#### 【ENDING】|### 【ENDING】|【ENDING】|$)/i);
            if (loop2Match) {
                const loopContent = loop2Match[1];

                const route1Match = loopContent.match(/🔄\s*路线1[^]*?：([\s\S]*?)(?=🔄\s*路线2|【NPC_LOVER|$)/);
                if (route1Match) {
                    sections.loop2.route1 = this.extractLoopLines(route1Match[1]);
                }

                const route2Match = loopContent.match(/🔄\s*路线2[^]*?：([\s\S]*?)(?=【NPC_LOVER|#### 【|### 【|$)/);
                if (route2Match) {
                    sections.loop2.route2 = this.extractLoopLines(route2Match[1]);
                }

                const npcMatches = loopContent.match(/【NPC_LOVER[^】]*】([\s\S]*?)(?=🔄|【NPC_|#### 【|### 【|$)/g);
                if (npcMatches) {
                    npcMatches.forEach(match => {
                        const npcContent = match.replace(/【NPC_LOVER[^】]*】/, '').trim();
                        const lines = npcContent.split('\n')
                            .filter(l => l.trim().startsWith('-') || l.trim().startsWith('*'))
                            .map(l => l.replace(/^[\s\-\*]+/, '').trim())
                            .filter(l => l);
                        sections.npcLover.push(...lines);
                    });
                }
            }

            // 【ENDING】尾声（随机选一）
            const endingMatch = this.md.match(/【ENDING】[^]*?随机结局\n([\s\S]*?)(?=#### 【EPILOGUE】|### 【EPILOGUE】|【EPILOGUE】|$)/i);
            if (endingMatch) {
                const endings = [];
                const aMatch = endingMatch[1].match(/\*\*结局A[：:]\*\*([\s\S]*?)(?=\*\*结局B|$)/);
                const bMatch = endingMatch[1].match(/\*\*结局B[：:]\*\*([\s\S]*?)(?=\*\*结局C|$)/);
                const cMatch = endingMatch[1].match(/\*\*结局C[：:]\*\*([\s\S]*?)(?=#### 【|### 【|【|$)/);
                if (aMatch) endings.push(aMatch[1].trim());
                if (bMatch) endings.push(bMatch[1].trim());
                if (cMatch) endings.push(cMatch[1].trim());
                sections.ending = endings;
            }

            // 【EPILOGUE】景物结尾（固定）
            const epilogueMatch = this.md.match(/【EPILOGUE】\n([\s\S]*?)$/i);
            if (epilogueMatch) {
                const text = epilogueMatch[1].trim();
                sections.epilogue = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
            }

            return sections;
        }

        extractLoopLines(text) {
            const lines = [];
            const content = text.split('循环文本池')[1] || text;
            if (content) {
                const matches = content.match(/^\s*\d+\.\s*(.+?)(?=\n\s*\d+\.|$)/gm);
                if (matches) {
                    matches.forEach(match => {
                        const line = match.replace(/^\s*\d+\.\s*/, '').trim();
                        if (line) lines.push(line);
                    });
                }
            }
            return lines;
        }

        getStoryFlow() {
            const flow = [];

            // 1. 开局（固定）
            if (this.parsed.opening.length > 0) {
                flow.push({ type: 'opening', lines: this.parsed.opening });
            }

            // 2. 随机分支三选一（播放一次）
            if (this.parsed.branch3.length > 0) {
                const branchIdx = Math.floor(Math.random() * Math.min(this.parsed.branch3.length, 3));
                const selectedBranch = this.parsed.branch3[branchIdx];
                const branchLines = selectedBranch.split('\n').filter(l => l.trim());
                flow.push({ type: 'branch', lines: branchLines });
            }

            // 3. 循环池（核心）- 随机选择route1或route2
            const selectedRoute = Math.random() < 0.5 ? 'route1' : 'route2';
            const loopLines = this.parsed.loop2[selectedRoute];
            
            if (loopLines.length > 0) {
                flow.push({ 
                    type: 'loop', 
                    pool: loopLines,  // 存储整个循环池
                    npcPool: this.parsed.npcLover  // NPC台词池
                });
            }

            // 4. 尾声（随机选一条）
            if (this.parsed.ending.length > 0) {
                const endingIdx = Math.floor(Math.random() * Math.min(this.parsed.ending.length, 3));
                const endingLine = this.parsed.ending[endingIdx];
                flow.push({ type: 'ending', line: endingLine });
            }

            // 5. 固定景物结尾
            if (this.parsed.epilogue.length > 0) {
                flow.push({ type: 'epilogue', lines: this.parsed.epilogue });
            }

            return flow;
        }
    }
    </script>

    <script>
        let GAME_SPEED = 1;

        function setGameSpeed(speed) {
            GAME_SPEED = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`speed-${speed}x`).classList.add('active');
            console.log(`游戏倍速已设置为 ×${speed}`);
        }
    </script>
    
    <script>
        const SimpleEngine = {
            gameLoopInterval: null,
            skills: {},
            initComplete: false,

            init() {
                console.log('🚀 简化引擎启动...');
                this.loadSkillsFromShared();
                this.startGameLoop();
                this.initComplete = true;
                console.log('✅ 简化引擎启动完成');
            },

            loadSkillsFromShared() {
                const skillNames = ['侦查', '追踪', '战斗', '黑客', '情感', '专注', '交涉'];
                skillNames.forEach(name => {
                    this.skills[name] = {
                        name: name,
                        level: 1,
                        experience: 0,
                        gainPerSecond: Math.floor(Math.random() * 3) + 1
                    };
                });
                console.log('📊 已加载技能:', Object.keys(this.skills));
            },

            startGameLoop() {
                if (this.gameLoopInterval) {
                    clearInterval(this.gameLoopInterval);
                }
                this.gameLoopInterval = setInterval(() => {
                    this.update();
                    this.render();
                }, 1000);
            },

            update() {
                // 如果暂停，不更新
                if (typeof gameState !== 'undefined' && gameState.isPaused) return;
                
                for (const skillName in this.skills) {
                    const skill = this.skills[skillName];
                    skill.experience += skill.gainPerSecond * GAME_SPEED;
                    this.checkLevelUp(skill);
                }
            },

            checkLevelUp(skill) {
                const requiredExp = skill.level * 100;
                if (skill.experience >= requiredExp) {
                    skill.level++;
                    skill.experience -= requiredExp;
                    console.log(`🎉 ${skill.name} 升级到 Lv.${skill.level}`);
                }
            },

            render() {
                updateSkillsUI();
                checkClearConditions();
            },

            getSkillLevel(skillName) {
                const skill = this.skills[skillName];
                return skill ? skill.level : 1;
            },

            stop() {
                if (this.gameLoopInterval) {
                    clearInterval(this.gameLoopInterval);
                    this.gameLoopInterval = null;
                }
                console.log('⏹️ 简化引擎已停止');
            }
        };
    </script>

    <script>
        let gameState = {
            currentDungeon: null,
            currentLine: 0,
            sanValue: 100,
            sanMax: 100,
            isEnded: false,
            isPaused: false,            // 新增：暂停状态（由现实锚点控制）
            isClearable: false,        // 是否满足通关条件（显示完成按钮）
            shouldExitLoop: false,      // 是否满足循环退出条件（停止循环播放）
            storyInterval: null,
            checkConditionsInterval: null,
            dungeonData: null,
            storyFlow: null,
            flowIndex: 0,
            lineIndex: 0,
            inLoopPhase: false,
            loopCounter: 0
        };

        document.addEventListener('DOMContentLoaded', function() {
            // 确保 SharedData 存在
            if (typeof SharedData === 'undefined') {
                 window.SharedData = { san: 100, completedDungeons: [], souvenirs: [], currentDungeon: '' };
            }
            if (typeof loadSharedData === 'function') loadSharedData();

            const urlParams = new URLSearchParams(window.location.search);
            const dungeonId = urlParams.get('dungeon');

            if (!dungeonId) {
                console.error('❌ 未提供副本ID');
                // 这里为了演示，默认加载火星赌场，实际使用请取消注释下面的返回代码
                // alert('未提供副本ID，返回后台...');
                // window.location.href = 'index.html';
                // return;
                initGame("mars_casino"); 
            } else {
                 console.log('📖 进入副本:', dungeonId);
                 initGame(dungeonId);
            }
        });

        function initGame(dungeonId) {
            gameState.currentDungeon = dungeonId;
            gameState.sanValue = SharedData.san;

            loadDungeonData(dungeonId);
            SimpleEngine.init();

            updateSanDisplay();
            updateDungeonInfo(dungeonId);

            document.getElementById('skillsSummary').classList.remove('hidden');

            startStoryProgression();
            startConditionsCheck();
            
            // 启动现实锚点信号监听
            initRealityAnchorListener();
        }
        
        // ==========================================
        // 现实锚点信号监听系统
        // ==========================================
        
        const SIGNAL_KEY = 'reality_anchor_signal';
        let signalPollInterval = null;
        let lastSignalTime = null;
        
        function initRealityAnchorListener() {
            console.log('🎯 [副本] 启动现实锚点信号监听...');
            
            // 每秒检查信号
            signalPollInterval = setInterval(pollRealitySignal, 1000);
            
            // 检查当前是否应该处于暂停状态
            checkInitialPauseState();
        }
        
        function pollRealitySignal() {
            const signalData = localStorage.getItem(SIGNAL_KEY);
            if (!signalData) return;
            
            try {
                const packet = JSON.parse(signalData);
                
                // 避免重复处理
                if (lastSignalTime === packet.timestamp) return;
                lastSignalTime = packet.timestamp;
                
                console.log(`🎯 [副本收到信号] ${packet.type}`);
                
                switch(packet.type) {
                    case 'ENTER_DUNGEON':

        }
        

        function loadDungeonData(dungeonId) {
            // 从 DUNGEON_STORIES 获取数据
            const data = DUNGEON_STORIES[dungeonId];

            if (!data) {
                console.error('❌ 剧本数据不存在:', dungeonId);
                document.getElementById('storyContainer').innerHTML =
                    '<div style="text-align: center; color: #e74c3c;">无法加载剧本数据：副本不存在</div>';
                return;
            }

            gameState.dungeonData = data;

            if (data.storyMD) {
                const parser = new StoryParser(data.storyMD);
                gameState.storyFlow = parser.getStoryFlow();
                gameState.flowIndex = 0;
                gameState.lineIndex = 0;
                console.log('✅ MD剧本已加载，流程:', gameState.storyFlow.length, '个段落');
            }

            showNextLine();
            gameState.currentLine = 1;
        }

        function startStoryProgression() {
            gameState.storyInterval = setInterval(() => {
                if (gameState.isEnded || gameState.isPaused) return;

                if (gameState.storyFlow) {
                    playStoryFlow();
                }
            }, 3000 / GAME_SPEED);
        }

        function playStoryFlow() {
            if (gameState.flowIndex >= gameState.storyFlow.length) {
                console.log('📖 剧本流程全部播放完毕');
                return;
            }

            const currentBlock = gameState.storyFlow[gameState.flowIndex];

            // 处理循环阶段
            if (currentBlock.type === 'loop') {
                handleLoopPhase(currentBlock);
                return;
            }

            // 处理单条台词
            if (currentBlock.line) {
                displayStoryLine(currentBlock.line, currentBlock.type);
                gameState.flowIndex++;
                gameState.lineIndex = 0;
                return;
            }

            // 处理多行台词块
            if (currentBlock.lines) {
                if (gameState.lineIndex < currentBlock.lines.length) {
                    displayStoryLine(currentBlock.lines[gameState.lineIndex], currentBlock.type);
                    gameState.lineIndex++;
                } else {
                    gameState.flowIndex++;
                    gameState.lineIndex = 0;
                }
            }
        }

        function handleLoopPhase(loopBlock) {
            gameState.inLoopPhase = true;
            
            // 检查是否满足循环退出条件（不是通关条件！）
            if (gameState.shouldExitLoop) {
                console.log('⏭️ 满足循环退出条件，停止循环，继续播放后续台词');
                gameState.inLoopPhase = false;
                gameState.flowIndex++;
                gameState.lineIndex = 0;
                return;
            }

            gameState.loopCounter++;
            
            // 每5条台词插入一次NPC台词
            if (gameState.loopCounter % 5 === 0 && loopBlock.npcPool && loopBlock.npcPool.length > 0) {
                const npcLine = loopBlock.npcPool[Math.floor(Math.random() * loopBlock.npcPool.length)];
                displayStoryLine(npcLine, 'npc_lover');
            } else {
                const randomLine = loopBlock.pool[Math.floor(Math.random() * loopBlock.pool.length)];
                displayStoryLine(randomLine, 'loop');
            }
        }

        function displayStoryLine(text, type = 'normal') {
            const container = document.getElementById('storyContainer');
            container.innerHTML = '';

            const lineDiv = document.createElement('div');
            lineDiv.className = `story-line story-${type}`;

            let prefix = '';
            if (type === 'npc_lover') {
                prefix = '[太宰] ';
            }

            lineDiv.textContent = prefix + text;
            container.appendChild(lineDiv);
            container.scrollTop = container.scrollHeight;
        }

            if (!gameState.dungeonData) return;
            displayStoryLine('剧本加载中...', 'normal');

            const sanFill = document.getElementById('sanFill');
            if (gameState.sanValue > 70) {
                sanFill.style.background = 'linear-gradient(90deg, #2ecc71 0%, #27ae60 100%)';
            } else if (gameState.sanValue > 40) {

            } else {

            }
        }

        function updateDungeonInfo(dungeonId) {
            // 优先使用 DungeonConfig (如果有), 否则降级使用 DUNGEON_STORIES
            let dungeon = (typeof DungeonConfig !== 'undefined') ? DungeonConfig[dungeonId] : null;
            if (!dungeon) dungeon = DUNGEON_STORIES[dungeonId];

            document.getElementById('dungeonTitle').textContent = dungeon.name;
            document.getElementById('dungeonDifficulty').textContent = '★'.repeat(dungeon.difficulty || 2);

            const conditionsList = document.getElementById('conditionsList');
            conditionsList.innerHTML = '';

            // 如果没有 clearConditions (因为在纯文本数据里没有)，就造一个假的默认条件，防止报错
            const clearConditions = dungeon.clearConditions || { '侦查': 2 };

            for (const [skillName, requiredLevel] of Object.entries(clearConditions)) {
                const currentLevel = SimpleEngine.getSkillLevel(skillName);
                const isMet = currentLevel >= requiredLevel;

                const item = document.createElement('div');
                item.className = 'condition-item ' + (isMet ? 'met' : 'not-met');
                item.innerHTML = `
                    <span>${skillName}</span>
                    <span>${currentLevel} / ${requiredLevel}</span>

                conditionsList.appendChild(item);
            }

        function updateSkillsUI() {
            const skillsGrid = document.getElementById('skillsGrid');
            if (!skillsGrid || skillsGrid.parentElement.classList.contains('hidden')) return;

            skillsGrid.innerHTML = '';

            for (const skillName in SimpleEngine.skills) {
                const skill = SimpleEngine.skills[skillName];
                const requiredExp = skill.level * 100;
                const expPercentage = (skill.experience / requiredExp) * 100;
                const item = document.createElement('div');
                item.className = 'skill-item';
                item.innerHTML = `
                    <div class="skill-name">${skill.name}</div>
                    <div class="skill-level">Lv.${skill.level}</div>
                    <div class="skill-progress-bar">
                        <div class="skill-progress-fill" style="width: ${expPercentage}%"></div>
                    </div>
                    <div class="skill-exp">${skill.experience} / ${requiredExp}</div>
                `;
                skillsGrid.appendChild(item);
            }
        }

        function startConditionsCheck() {
            gameState.checkConditionsInterval = setInterval(() => {
                checkClearConditions();
            }, 5000 / GAME_SPEED);
        }

        function checkClearConditions() {
            if (!gameState.currentDungeon || gameState.isEnded) return;

            let dungeon = (typeof DungeonConfig !== 'undefined') ? DungeonConfig[gameState.currentDungeon] : DUNGEON_STORIES[gameState.currentDungeon];
            
            // 容错处理：如果数据源里没有条件，默认给一个
            const clearConditions = dungeon.clearConditions || { '侦查': 2 };
            const loopExitConditions = dungeon.loopExitConditions || {};

            // 检测通关条件（任意一个满足即可）
            let canClear = false;
            for (const [skillName, requiredLevel] of Object.entries(clearConditions)) {
                const currentLevel = SimpleEngine.getSkillLevel(skillName);
                if (currentLevel >= requiredLevel) {
                    canClear = true;
                    break;
                }
            }

            // 检测循环退出条件（任意一个满足即可）
            let canExitLoop = false;
            if (Object.keys(loopExitConditions).length > 0) {
                for (const [skillName, requiredLevel] of Object.entries(loopExitConditions)) {
                    const currentLevel = SimpleEngine.getSkillLevel(skillName);
                    if (currentLevel >= requiredLevel) {
                        canExitLoop = true;
                        break;
                    }
                }
            } else {
                canExitLoop = canClear;
            }

            updateDungeonInfo(gameState.currentDungeon);
            gameState.isClearable = canClear;
            gameState.shouldExitLoop = canExitLoop;

            const completeBtn = document.getElementById('completeBtn');
            if (canClear) {
                completeBtn.classList.remove('hidden');
            } else {
                completeBtn.classList.add('hidden');
            }
        }

        function completeDungeon() {
            if (!confirm('确定要完成剧本吗？\n\n将获得纪念品和SAN奖励。')) {

            clearInterval(gameState.storyInterval);

            let dungeon = (typeof DungeonConfig !== 'undefined') ? DungeonConfig[gameState.currentDungeon] : DUNGEON_STORIES[gameState.currentDungeon];
            
            // 容错数据

                SharedData.completedDungeons.push(gameState.currentDungeon);

            SharedData.currentDungeon = '';
            if (typeof saveSharedData === 'function') saveSharedData();

            showEndingPanel(souvenir);

        }

        function confirmExit() {
            if (confirm('确定要退出剧本吗？\n\n⚠️ 中途退出将无法获得任何奖励，SAN值不会恢复。\n\n是否继续？')) {
                exitDungeonAbandon();

            console.log('🚪 中途退出剧本');
            window.location.href = 'index.html';
        }

        function returnToBackend() {
            window.location.href = 'index.html';
        }
